<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Story+Script&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a69bb36f9d.js" crossorigin="anonymous"></script>
</head>
<body>
   <!-- Header starts here -->
    <section class="header">
       <h1>Floral</h1>


       <nav>
           <a href=""><i class="fa-solid fa-house"></i>Home</a>
           <a href=""><i class="fa-solid fa-info"></i>About</a>
           <a href="">Services</a>
           <a href="">Blog</a>
       </nav>


       <button class="btn">Connect With Us</button>
    </section>
    <!-- header ends -->


    <!-- Home starts -->
     <section class="home" id="home" >
       <div class="content">
           <h1>Welcome To <br> My Flower Shop</h1>
       </div>
     </section>
     <!-- Home Ends -->


     <!-- Contact begins -->
   <section class="contact" id="contact">
       <form action="">
           <div class="details">
               <label for="name">Name:</label>
               <input type="text" placeholder="John Doe">
           </div>


           <div class="details">
               <label for="phone">Phone:</label>
               <input type="text" >
           </div>


           <div class="details">
               <label for="email">Email:</label>
               <input type="email" name="email" id="email" placeholder="happy@gmail.com">
           </div>


           <div class="details">
               <label for="password">Password:</label>
               <input type="password" name="password" id="password">
           </div>


           <div class="details">
               <h3>What is the favorite color?</h1>
               <input type="radio" name="color" id="color">Blue
               <input type="radio" name="pink" id="pink"> Pink
               <input type="radio" name="red" id="red"> Red
               <input type="radio" name="green" id="green"> Green
           </div>


           <div class="details">
               <input type="checkbox">Peperonni
               <input type="checkbox"> Cheese
               <input type="checkbox">Macaroni
           </div>


           <div class="details">
               <h3>Choose your favorite car</h3>
               <select name="" id="">
                   <option value="Audi">Audi</option>
                   <option value="volvo">Volvo</option>
                   <option value="mercedes">Mercedes</option>
               </select>
           </div>


           <button type="submit" class="btn">Submit</button>
           <button type="reset" class="btn">Reset</button>
       </form>
   </section>




    
</body>
</html>

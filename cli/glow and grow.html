<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow & Grow | Aesthetic Teen Sanctuary</title>
    <style>
        :root {
            --yellow: #F0E68C;
            --lavender: #E1B7E4;
            --mint: #B2D8D8;
            --pink: #FFC1D4;
            --warm-grey: #D6C3C1;
            --peach: #F3D5C7;
            --soft-blue: #C8D6E5;
            --dark-blue: #A2C2D4;
            --bg-color: #FAF8F5;
            --text-color: #554C4A;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        header {
            background-color: var(--lavender);
            padding: 3rem 1rem;
            text-align: center;
            border-bottom: 4px solid var(--pink);
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
            color: #4A3B4C;
            letter-spacing: 1px;
        }

        header p {
            font-style: italic;
            color: #6A5B6C;
            font-size: 1.15rem;
            margin-top: 5px;
        }

        nav {
            background-color: var(--mint);
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav button {
            background: transparent;
            border: none;
            color: #2F4F4F;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-size: 0.95rem;
        }

        nav button:hover, nav button.active {
            background-color: var(--soft-blue);
            transform: scale(1.05);
        }

        .page-section {
            display: none;
            max-width: 950px;
            margin: 40px auto;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 6px 25px rgba(214, 195, 193, 0.35);
        }

        .page-section.active {
            display: block;
        }

        h2 {
            color: #A2C2D4;
            border-bottom: 3px solid var(--peach);
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 2rem;
        }

        h3 {
            color: #4A3B4C;
        }

        .quiz-box {
            background-color: var(--peach);
            padding: 30px;
            border-radius: 20px;
            margin-top: 25px;
        }

        .cta-button {
            background-color: var(--pink);
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: bold;
            color: #554C4A;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            font-size: 1rem;
        }

        .cta-button:hover {
            transform: scale(1.05);
            background-color: var(--lavender);
        }

        .search-bar {
            width: 100%;
            padding: 14px 22px;
            border-radius: 25px;
            border: 2px solid var(--warm-grey);
            font-size: 1.05rem;
            margin-bottom: 25px;
            outline: none;
            box-sizing: border-box;
            background-color: #FFFDF9;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-top: 20px;
            max-height: 650px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .blog-card {
            background-color: var(--soft-blue);
            padding: 22px;
            border-radius: 18px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            border: 2px solid transparent;
        }

        .blog-card:hover {
            transform: translateY(-4px);
            background-color: var(--lavender);
            border-color: var(--pink);
        }

        .tag {
            display: inline-block;
            background-color: var(--yellow);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #5A5230;
        }

        .blog-post-view {
            display: none;
            margin-top: 20px;
        }

        .tracker-container {
            background-color: #F9F6F0;
            padding: 25px;
            border-radius: 20px;
            margin-top: 20px;
        }

        .tracker-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .tracker-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.05rem;
        }

        .tracker-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

            background: #FFC1D4;
            border: none;
